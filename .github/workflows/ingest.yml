name: ME9 news ingestion
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/ingest.py"
      - ".github/workflows/ingest.yml"
permissions:
  contents: write
concurrency:
  group: me9-ingestion
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install language detection library
        run: pip install langdetect
      - name: Fetch public RSS feeds, deduplicate and enrich
        env:
          ME9_OPENAI_API_KEY: ${{ secrets.ME9_OPENAI_API_KEY }}
        run: python scripts/ingest.py
      - name: Commit and safely push refreshed dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json data/image_cache.json
          if git diff --cached --quiet; then
            echo "Dataset unchanged."
            exit 0
          fi
          git commit -m "chore: refresh ME9 news feed"
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git rebase origin/main; then
              # Both the workflow run and another recent run may update the feed.
              # Keep this run's freshly generated feed when that file conflicts.
              if git status --short | grep -Eq 'data/(news.json|image_cache.json)'; then
                for file in data/news.json data/image_cache.json; do
                  if git status --short -- "$file" | grep -q .; then
                    git checkout --theirs -- "$file"
                    git add "$file"
                  fi
                done
                GIT_EDITOR=true git -c core.editor=true rebase --continue
              else
                git rebase --abort
                echo "Rebase conflict outside the generated feed."
                exit 1
              fi
            fi
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
            sleep 2
          done
          echo "Could not push after three attempts."
          exit 1
